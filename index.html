<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 💜</title>
  
  <!-- 引入 Google Fonts 可愛圓潤字體 (Zen Maru Gothic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       【1. 主題配色與變數定義】
       在這裡可以輕鬆調整藍紫色的色彩氛圍！
       ========================================================= */
    :root {
      /* 網頁主背景與漸層色 */
      --bg-gradient-1: #e0c3fc; /* 淺紫 */
      --bg-gradient-2: #8ec5fc; /* 淺藍 */
      
      /* 文字顏色 */
      --text-main: #4a3e6d;     /* 深藍紫 */
      --text-muted: #8c82a6;    /* 淺藍紫 */
      
      /* 卡片配色 */
      --card-bg: rgba(255, 255, 255, 0.85); /* 半透明奶白色 */
      --card-border: #d4c5f9;  /* 卡片預設邊框 */
      
      /* 高亮 / 輪播發光顏色 (焦點特效) */
      --highlight-border: #7b2cbf; /* 焦點深紫色邊框 */
      --highlight-glow: rgba(157, 78, 221, 0.6); /* 焦點發光暈影 */
      --highlight-accent: #ff9ebb; /* 焦點可愛粉紅點綴 */
      
      /* 動畫時間與字體 */
      --transition-speed: 0.5s;
      --font-family: 'Zen Maru Gothic', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
      min-height: 100vh;
      color: var(--text-main);
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* 頁面標題區塊 */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-main);
      text-shadow: 2px 2px 0px #ffffff;
      display: inline-block;
      position: relative;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    /* 容器設定 */
    .container {
      max-w: 1200px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* =========================================================
       【2. 載入中酷炫動畫 (Loading Screen)】
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
      gap: 1.5rem;
    }

    /* 旋轉可愛雙環動畫 */
    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.6);
      border-top: 5px solid var(--highlight-border);
      border-bottom: 5px solid var(--highlight-accent);
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    .loading-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* =========================================================
       【3. 瀑布流排版 (Masonry Layout)】
       使用 CSS Column-count 實現高低錯落效果
       ========================================================= */
    .masonry-wall {
      column-count: 3;       /* 桌機顯示 3 欄 */
      column-gap: 1.5rem;     /* 欄位間距 */
      width: 100%;
      display: none;          /* 預設隱藏，資料載入後顯示 */
    }

    /* RWD 響應式欄位調整 */
    @media (max-width: 900px) {
      .masonry-wall { column-count: 2; } /* 平板 2 欄 */
    }
    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; } /* 手機 1 欄 */
    }

    /* =========================================================
       【4. 留言卡片樣式與焦點 (Highlight) 特效】
       ========================================================= */
    .message-card {
      break-inside: avoid;    /* 避免卡片跨欄斷裂 */
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(10px);
      
      /* 平滑過渡動畫 (焦點切換時順暢變形) */
      transition: transform var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease,
                  border-color var(--transition-speed) ease,
                  filter var(--transition-speed) ease,
                  opacity var(--transition-speed) ease;
      
      position: relative;
      cursor: pointer;
    }

    /* 卡片頭部 (名字與時間) */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      border-bottom: 2px dashed #ece6ff;
      padding-bottom: 0.5rem;
    }

    .user-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* 名字前可愛的小圓點裝飾 */
    .user-name::before {
      content: '✦';
      color: var(--highlight-accent);
    }

    .post-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 留言內容 */
    .card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #332c4a;
      white-space: pre-wrap; /* 保留換行 */
      word-break: break-word; /* 避免長英文打破版面 */
    }

    /* ---------------------------------------------------------
       【重點】輪播焦點 (Highlight) 特效樣式
       --------------------------------------------------------- */
    /* 1. 當卡片被選中 (Focused / Highlighted) */
    .message-card.highlight {
      transform: scale(1.06); /* 放大卡片 */
      border-color: var(--highlight-border);
      box-shadow: 0 0 25px var(--highlight-glow), 0 12px 30px rgba(0, 0, 0, 0.15);
      filter: blur(0px) brightness(1.05);
      opacity: 1;
      z-index: 10; /* 保證放大時在最上層 */
    }

    /* 焦點卡片右上角的「目前展出」星號徽章 */
    .message-card.highlight::after {
      content: '💖 SpotLight';
      position: absolute;
      top: -12px;
      right: 15px;
      background: var(--highlight-accent);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(255, 158, 187, 0.5);
    }

    /* 2. 當有卡片處於高亮時，其他「未被選中」卡片的背景模糊與暗化效果 */
    .masonry-wall.has-active-card .message-card:not(.highlight) {
      filter: blur(1.5px) opacity(0.5); /* 輕微模糊並降低透明度 */
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 標題區 -->
    <header class="header">
      <h1>✨ 朋友對我的悄悄話留言牆 ✨</h1>
      <p>每隔幾秒鐘，將為您展覽每一位朋友的心聲～</p>
    </header>

    <!-- 載入中動畫區塊 -->
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">讀取留言中，請稍候... 💜</div>
    </div>

    <!-- 留言瀑布流牆 -->
    <main id="masonryWall" class="masonry-wall"></main>
  </div>

  <script>
    /* =========================================================
       【可供後續修改的參數設定】
       ========================================================= */
    // 1. Google 試算表 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR3tnZwuNLulaLdIzrkJNZsHsRrX7BaYJHDRUPNGLSAIN3ig6SVSvwua-K7X9j8HJF2LWbL94Gc5LJL/pub?output=csv';
    
    // 2. 輪播切換時間 (單位：毫秒)，預設 3000ms = 3 秒
    const ROTATE_INTERVAL = 3000; 

    // 全域變數
    let messagesData = [];
    let currentIndex = 0;
    let timerId = null;

    /* =========================================================
       【功能 A】CSV 安全解析器 (含處理雙引號與逗號)
       ========================================================= */
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const result = [];

      lines.forEach((line, index) => {
        // 跳過 CSV 標題列 (Header)
        if (index === 0 && (line.includes('時間戳記') || line.includes('Timestamp'))) return;

        const row = [];
        let insideQuotes = false;
        let entry = '';

        for (let i = 0; i < line.length; i++) {
          const char = line[i];

          if (char === '"') {
            insideQuotes = !insideQuotes; // 切換雙引號狀態
          } else if (char === ',' && !insideQuotes) {
            row.push(entry.trim());
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim());

        // 清除儲存格內容前後多餘的雙引號
        const cleanRow = row.map(item => item.replace(/^"(.*)"$/, '$1').replace(/""/g, '"'));

        // 依欄位順序儲存：[0]時間戳記, [1]名字, [2]悄悄話
        if (cleanRow.length >= 3) {
          result.push({
            timestamp: cleanRow[0] || '剛剛',
            name: cleanRow[1] || '無名氏',
            content: cleanRow[2] || '這是一則空白留言~'
          });
        }
      });

      return result;
    }

    /* =========================================================
       【功能 B】動態渲染卡片至頁面
       ========================================================= */
    function renderCards(data) {
      const wall = document.getElementById('masonryWall');
      const loading = document.getElementById('loading');

      // 隱藏載入中動畫，顯示瀑布流牆
      loading.style.display = 'none';
      wall.style.display = 'block';

      if (data.length === 0) {
        wall.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">目前還沒有收到留言喔！</p>';
        return;
      }

      // 動態組裝每張卡片 HTML
      wall.innerHTML = data.map((item, index) => `
        <article class="message-card" data-index="${index}">
          <div class="card-header">
            <span class="user-name">${escapeHTML(item.name)}</span>
            <span class="post-time">${formatDate(item.timestamp)}</span>
          </div>
          <div class="card-body">${escapeHTML(item.content)}</div>
        </article>
      `).join('');

      // 為卡片加上滑鼠移入點擊事件 (可手動選擇卡片)
      const cards = document.querySelectorAll('.message-card');
      cards.forEach(card => {
        card.addEventListener('mouseenter', () => {
          const idx = parseInt(card.getAttribute('data-index'));
          setHighlightCard(idx);
          stopCarousel(); // 滑鼠游標移入時暫停輪播
        });

        card.addEventListener('mouseleave', () => {
          startCarousel(); // 滑鼠游標離開時恢復自動輪播
        });
      });

      // 啟動自動輪播特效
      startCarousel();
    }

    /* =========================================================
       【功能 C】輪播 Highlight 焦點控制 logic
       ========================================================= */
    function setHighlightCard(index) {
      const wall = document.getElementById('masonryWall');
      const cards = document.querySelectorAll('.message-card');

      if (cards.length === 0) return;

      // 加上父容器 class，啟動「未被選中卡片變暗變模糊」CSS
      wall.classList.add('has-active-card');

      // 移除所有卡片的 highlight 類別
      cards.forEach(card => card.classList.remove('highlight'));

      // 為當前目標卡片加上 highlight
      if (cards[index]) {
        cards[index].classList.add('highlight');
        currentIndex = index;
      }
    }

    // 啟動輪播定時器 (setInterval)
    function startCarousel() {
      if (timerId) clearInterval(timerId);

      timerId = setInterval(() => {
        if (messagesData.length === 0) return;

        // 計算下一個高亮卡片的索引 (循環播放)
        currentIndex = (currentIndex + 1) % messagesData.length;
        setHighlightCard(currentIndex);

      }, ROTATE_INTERVAL); // 秒數依據開頭定義的 ROTATE_INTERVAL
    }

    // 暫停輪播
    function stopCarousel() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    /* =========================================================
       【功能 D】工具函式 (防 XSS 攻擊 & 時間格式化)
       ========================================================= */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(timeStr) {
      // 簡單修飾 Google 表單傳回的時間格式
      if (!timeStr) return '';
      const parts = timeStr.split(' ');
      return parts[0] ? parts[0] : timeStr;
    }

    /* =========================================================
       【功能 E】初始化：使用 fetch 抓取 Google 試算表 CSV
       ========================================================= */
    async function init() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('無法讀取 Google 試算表資料');

        const csvData = await response.text();
        messagesData = parseCSV(csvData);

        // 渲染畫面
        renderCards(messagesData);

      } catch (error) {
        console.error('Fetch Error:', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: #ff0055; text-align: center;">
            <p>❌ 留言資料載入失敗</p>
            <p style="font-size:0.8rem; margin-top:5px; color:var(--text-muted);">${error.message}</p>
          </div>
        `;
      }
    }

    // 頁面 Ready 後開始執行
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
