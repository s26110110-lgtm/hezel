<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？隨機抽籤機</title>
    <!-- 載入 Google 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <!-- 載入 Canvas Confetti (彩帶效果庫) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* 全域變數 - 溫暖活潑的黃橘色調 */
        :root {
            --bg-color: #FFF9F0;
            --primary-yellow: #FFD166;
            --primary-orange: #FF9F1C;
            --dark-orange: #E85D04;
            --accent-red: #EF476F;
            --accent-green: #06D6A0;
            --text-color: #4A3E3D;
            --card-bg: #FFFFFF;
        }

        /* 基礎設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(#ffe8d6 2px, transparent 2px);
            background-size: 24px 24px;
        }

        /* 主容器 */
        .container {
            background: var(--card-bg);
            border: 4px solid var(--text-color);
            border-radius: 32px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 8px 8px 0px var(--text-color);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 可愛標籤 */
        .badge {
            background-color: var(--primary-yellow);
            color: var(--text-color);
            border: 2px solid var(--text-color);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: inline-block;
        }

        /* 大標題 */
        #main-title {
            font-size: 2.2rem;
            color: var(--dark-orange);
            margin-bottom: 30px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }

        /* 標題彈跳動畫樣式 */
        .bounce-pop {
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            color: var(--accent-red) !important;
        }

        /* 抽籤按鈕 */
        .draw-button {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 16px 36px;
            border: 3px solid var(--text-color);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0px 6px 0px var(--text-color);
            transition: all 0.1s ease;
            outline: none;
            user-select: none;
        }

        .draw-button:hover {
            background-color: var(--dark-orange);
            transform: translateY(-2px);
            box-shadow: 0px 8px 0px var(--text-color);
        }

        .draw-button:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px var(--text-color);
        }

        /* 抽籤進行中的按鈕狀態 */
        .draw-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: 0px 2px 0px var(--text-color);
        }

        /* 結果卡片 */
        .result-card {
            margin-top: 30px;
            width: 100%;
            animation: fadeInUp 0.5s ease forwards;
        }

        .result-card.hidden {
            display: none;
        }

        .image-wrapper {
            width: 100%;
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid var(--text-color);
            box-shadow: 4px 4px 0px var(--text-color);
            margin-bottom: 20px;
            background-color: #eee;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 馬上出發 Google Map 按鈕 */
        .map-button {
            display: inline-block;
            width: 100%;
            background-color: var(--accent-green);
            color: #FFFFFF;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 14px 0;
            border: 3px solid var(--text-color);
            border-radius: 20px;
            box-shadow: 0px 4px 0px var(--text-color);
            transition: all 0.1s ease;
        }

        .map-button:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 0px var(--text-color);
        }

        .map-button:active {
            transform: translateY(2px);
            box-shadow: 0px 2px 0px var(--text-color);
        }

        .congrats-text {
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        /* 關鍵影格動畫 (Keyframes) */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-5deg);
            }
            70% {
                transform: scale(1.2) rotate(3deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部可愛小飾品 -->
        <div class="badge">🍽️ 解決選擇困難症</div>

        <!-- 標題區域 -->
        <h1 id="main-title" class="title-default">今天吃什麼？</h1>

        <!-- 抽籤按鈕 -->
        <button id="draw-btn" class="draw-button">
            <span>點我抽籤！</span>
        </button>

        <!-- 結果展示卡片 -->
        <div id="result-card" class="result-card hidden">
            <div class="image-wrapper">
                <img id="food-image" src="" alt="美食照片">
            </div>
            <div class="action-box">
                <p class="congrats-text">就決定吃這個了！😋</p>
                <a id="map-btn" class="map-button" href="#" target="_blank" rel="noopener noreferrer">
                    📍 馬上出發！ (Google Map)
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 食物資料庫
            const foodList = [
                {
                    name: "排骨飯",
                    image: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "水餃",
                    image: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "麥當勞",
                    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "義大利麵",
                    image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "便利商店",
                    image: "https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=600&q=80"
                }
            ];

            // DOM 元素
            const mainTitle = document.getElementById('main-title');
            const drawBtn = document.getElementById('draw-btn');
            const resultCard = document.getElementById('result-card');
            const foodImage = document.getElementById('food-image');
            const mapBtn = document.getElementById('map-btn');

            let isDrawing = false;

            drawBtn.addEventListener('click', startDraw);

            function startDraw() {
                if (isDrawing) return;
                isDrawing = true;

                drawBtn.disabled = true;
                resultCard.classList.add('hidden');
                mainTitle.classList.remove('bounce-pop');

                let counter = 0;
                const totalDuration = 2000;
                const speed = 80;

                const timer = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * foodList.length);
                    mainTitle.textContent = foodList[randomIndex].name;
                    counter += speed;

                    if (counter >= totalDuration) {
                        clearInterval(timer);
                        finishDraw();
                    }
                }, speed);
            }

            function finishDraw() {
                const finalChoice = foodList[Math.floor(Math.random() * foodList.length)];

                mainTitle.textContent = `✨ ${finalChoice.name} ✨`;
                mainTitle.classList.add('bounce-pop');

                foodImage.src = finalChoice.image;
                foodImage.alt = finalChoice.name;
                
                const googleMapUrl = `https://www.google.com/maps/search/${encodeURIComponent(finalChoice.name)}`;
                mapBtn.href = googleMapUrl;

                resultCard.classList.remove('hidden');

                drawBtn.disabled = false;
                isDrawing = false;

                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            }
        });
    </script>
</body>
</html>
